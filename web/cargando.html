<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizihotz Logo</title>
  <style>
    body {
      margin: 0;
      background-color: #f0fff4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .logo-img {
      max-width: 550px;
      width: 80%;
      height: auto;
    }

    .loader {
      margin-top: 30px;
      border: 6px solid #d9f2e6;
      border-top: 6px solid #228b22;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="1.png" alt="Logo Bizihotz" class="logo-img">
  <div class="loader"></div>

</body>
</html>
