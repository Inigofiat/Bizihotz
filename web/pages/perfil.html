<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil</title>
  <link rel="stylesheet" href="../css/perfil.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
</head>
<body>
  <div class="profile-container">
    <button type="button" class="page-close" id="closePerfilPage" aria-label="Volver">&times;</button>
    <div class="profile-card">
      <div class="avatar-wrapper">
        <img id="avatarImage" src="../images/avatar-default.svg" alt="Avatar" class="avatar" />
      </div>

      <h1 class="profile-name" id="profileName">Usuario</h1>

      <div class="profile-info" id="profileInfo">
        <p><span class="label">Nombre:</span> <span class="value">-</span></p>
        <p><span class="label">Apellidos:</span> <span class="value">-</span></p>
        <p><span class="label">Teléfono:</span> <span class="value">-</span></p>
        <p><span class="label">Rol:</span> <span class="value">-</span></p>
        <p><span class="label">Nombre de usuario:</span> <span class="value">-</span></p>
        <p><span class="label">Email:</span> <span class="value">-</span></p>
      </div>

      <div class="btn-group">
        <button class="btn edit" id="openEditProfile">Editar perfil</button>
        <button class="btn password" id="openPasswordModal">Cambiar contraseña</button>
      </div>
    </div>
  </div>

  <!-- Modal Editar Perfil -->
  <div class="modal" id="modalEditar">
    <div class="modal-content">
      <button class="close" id="closeModalEditar" aria-label="Cerrar">&times;</button>
      <h2>Editar Perfil</h2>
      <form id="formEditarPerfil">
        <label for="inputNombre">Nombre</label>
        <input type="text" id="inputNombre" value="" placeholder="Nombre" />

        <label for="inputApellidos">Apellidos</label>
        <input type="text" id="inputApellidos" value="" placeholder="Apellidos" />

        <label for="inputTelefono">Teléfono</label>
        <input type="text" id="inputTelefono" value="" placeholder="Telefono" />

        <label for="inputEmail">Email</label>
        <input type="email" id="inputEmail" value="" placeholder="Email" />

        <label for="inputNombreUsuario">Nombre de usuario</label>
        <input type="text" id="inputNombreUsuario" value="" placeholder="Nombre de usuario" />

        <label for="inputRol">Rol</label>
        <input type="text" id="inputRol" value="" placeholder="Rol" disabled aria-disabled="true" />

        <div class="avatar-field">
          <label for="avatarInput">Foto de perfil</label>
          <div class="avatar-upload">
            <div class="avatar-actions">
              <button type="button" id="btnSelectAvatar">Seleccionar imagen</button>
              <button type="button" id="btnRemoveAvatar" class="remove-avatar" disabled>Quitar foto</button>
            </div>
            <span id="avatarFilename" class="avatar-filename">Ningun archivo seleccionado</span>
          </div>
        </div>

        <input type="file" id="avatarInput" accept="image/*" hidden />

        <button type="submit" class="btn-filled">Guardar</button>
      </form>
    </div>
  </div>

  <!-- Modal Cambiar Contrasena -->
  <div class="modal" id="modalContrasena">
    <div class="modal-content">
      <button class="close" id="closeModalContrasena" aria-label="Cerrar">&times;</button>
      <h2>Cambiar Contrasena</h2>
      <form id="formCambiarContrasena">
        <label for="currentPassword">Contraseña actual</label>
        <div class="password-field">
          <input type="password" id="currentPassword" />
          <button type="button" class="togglePassword" data-input="currentPassword" aria-label="Mostrar u ocultar contrasena">
            <svg class="eyeIcon" viewBox="0 0 24 24"></svg>
          </button>
        </div>

        <label for="newPassword">Nueva contraseña</label>
        <div class="password-field">
          <input type="password" id="newPassword" />
          <button type="button" class="togglePassword" data-input="newPassword" aria-label="Mostrar u ocultar contrasena">
            <svg class="eyeIcon" viewBox="0 0 24 24"></svg>
          </button>
        </div>

        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" />
          <button type="button" class="togglePassword" data-input="confirmPassword" aria-label="Mostrar u ocultar contrasena">
            <svg class="eyeIcon" viewBox="0 0 24 24"></svg>
          </button>
        </div>

        <p id="passwordFeedback" class="feedback"></p>
      <button type="submit" class="btn-filled">Actualizar</button>
    </form>
  </div>
</div>

  <!-- Modal Recorte Avatar -->
  <div class="modal" id="cropModal">
    <div class="modal-content modal-crop">
      <button class="close" id="closeCropModal" aria-label="Cerrar">&times;</button>
      <h2>Recortar foto</h2>
      <div class="cropper">
        <div class="cropper-viewport" id="cropViewport">
          <img id="cropImage" alt="Recorte de avatar" />
        </div>
      </div>
      <label class="crop-label" for="cropZoom">Zoom</label>
      <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" />
      <div class="crop-actions">
        <button type="button" id="cancelCrop" class="btn ghost">Cancelar</button>
        <button type="button" id="applyCrop" class="btn-filled">Aplicar recorte</button>
      </div>
    </div>
  </div>

  <script src="../js/perfil.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
