<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Panel Bizihotz</title>

  <link rel="stylesheet" href="../css/principal.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />

</head>

<body>

  <div class="panel-container">

    <header class="header">

      <div class="profile">

        <div class="avatar">

          <img id="headerAvatar" src="../images/avatar-default.svg" alt="Avatar del usuario" />
        </div>

        <div>

          <h2 id="userName">Cargando...</h2>

          <p id="userLocation">---</p>

        </div>

      </div>



      <div class="datetime">

        <p id="date">--/--/----</p>

        <p id="time">--:--:--</p>

      </div>



      <div class="icons">
        <div class="notification-center">
          <div class="notification-button" id="notificationToggle" role="button" tabindex="0" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false">
            <img src="../images/campana.png" class="notification-button__icon" alt="" />
            <span class="notification-button__badge" id="notificationBadge" hidden>0</span>
          </div>
          <div class="notification-dropdown" id="notificationDropdown" hidden>
            <p class="notification-empty" id="notificationEmpty">Sin mensajes nuevos.</p>
            <ul class="notification-list" id="notificationList"></ul>
          </div>
        </div>

        <img src="../images/perfil.png" id="profileBtn" alt="Perfil" title="Ver perfil" />

        <img src="../images/logout.png" id="logoutBtn" alt="Cerrar sesion" title="Cerrar sesion" />

      </div>

    </header>



    <nav class="nav">

      <div class="nav-grid">

        <div class="nav-item"><button class="nav-button" data-nav="agenda"><span class="emoji">📅</span><span>Agenda</span></button></div>
        <div class="nav-item"><button class="nav-button" data-nav="nuevo-paciente"><span class="emoji">➕</span><span>Nuevo paciente</span></button></div>
        <div class="nav-item"><button class="nav-button" data-nav="mensajes"><span class="emoji">💬</span><span>Mensajes</span></button></div>
        <div class="nav-item"><button class="nav-button" data-nav="documentos"><span class="emoji">📄</span><span>Documentos</span></button></div>
        <div class="nav-item"><button class="nav-button" data-nav="historial"><span class="emoji">🩺</span><span>Historial clínico</span></button></div>
        <div class="nav-item"><button class="nav-button" data-nav="dietas"><span class="emoji">🥗</span><span>Dietas</span></button></div>
      </div>
    </nav>


    <section class="table-section">
      <div class="dashboard-heading">
        <h2 id="dashboardTitle">Agenda del día</h2>
        <p id="dashboardSubtitle">Todas las citas de hoy</p>
      </div>

      <div class="table-wrapper">

        <table id="appointmentsTable">

          <thead>

            <tr>

              <th>HORA</th>

              <th>PACIENTE</th>

              <th>MOTIVO</th>

              <th>ESTADO</th>

            </tr>

          </thead>

          <tbody></tbody>

        </table>

      </div>

    </section>

  </div>

  <a class="help-fab" href="ayuda.html" title="Centro de ayuda" aria-label="Centro de ayuda">
    Centro de ayuda
  </a>



  <div id="logoutModal" class="modal-overlay">

    <div class="modal-content">

      <p>¿Estas seguro de que deseas cerrar sesión?</p>

      <div class="modal-actions">

        <button id="confirmLogout" class="btn-confirm">Si, cerrar sesión</button>

        <button id="cancelLogout" class="btn-cancel">Cancelar</button>

      </div>

    </div>

  </div>



  <div id="profileModal" class="modal-overlay">

    <div class="modal-content modal-profile">

      <button type="button" id="closeProfileModal" class="modal-close">&times;</button>

      <h3>Perfil profesional</h3>



      <div class="profile-summary">

        <p><strong>Nombre:</strong> <span id="profileName">-</span></p>

        <p><strong>Email:</strong> <span id="profileEmail">-</span></p>

        <p><strong>Telefono:</strong> <span id="profilePhone">-</span></p>

        <p id="profileRoleWrapper"><span id="profileRole">-</span></p>

        <p class="profile-note" id="profilePasswordStatus"></p>

      </div>



      <div class="profile-actions">

        <button type="button" id="startPasswordChange" class="btn-confirm">Cambiar contraseña</button>

        <button type="button" id="closeProfile" class="btn-cancel">Cerrar</button>

      </div>



      <form id="passwordForm" autocomplete="off" class="password-form" hidden>

        <div class="form-group">

          <label for="currentPassword">Contraseña actual</label>

          <div class="input-with-toggle">

            <input type="password" id="currentPassword" minlength="6" />

            <button type="button" class="visibility-toggle" data-target="currentPassword">Mostrar</button>

          </div>

        </div>

        <div class="form-group">

          <label for="newPassword">Nueva contraseña</label>

          <div class="input-with-toggle">

            <input type="password" id="newPassword" minlength="8" />

            <button type="button" class="visibility-toggle" data-target="newPassword">Mostrar</button>

          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">Confirmar nueva contraseña</label>

          <div class="input-with-toggle">

            <input type="password" id="confirmPassword" minlength="8" />

            <button type="button" class="visibility-toggle" data-target="confirmPassword">Mostrar</button>

          </div>

        </div>

        <p id="passwordFeedback" class="modal-feedback"></p>

        <div class="modal-actions">

          <button type="submit" class="btn-confirm">Guardar contraseña</button>

          <button type="button" id="cancelPasswordChange" class="btn-cancel">Cancelar</button>

        </div>

      </form>

    </div>

  </div>



  <script src="../js/live-refresh.js"></script>
  <script src="../js/perfil-modal.js"></script>

  <script src="../js/principal.js"></script>
  <script src="../js/chatbot.js"></script>

</body>

</html>
