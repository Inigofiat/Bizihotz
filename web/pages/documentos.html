<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentos nutricionales</title>
  <link rel="stylesheet" href="../css/documentos.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="principal.html" class="back-btn has-logo" id="volverPanel" aria-label="Volver al panel">
        <img src="../images/2.png" alt="Logo Bizihotz" />
      </a>
      <div class="topbar__titles">
        <p class="eyebrow">Recursos</p>
        <h1>Documentos nutricionales</h1>
      </div>
      <div class="topbar__meta">
        <span class="pill"><span id="docCount">--</span> documentos</span>
      </div>
    </header>

    <main class="content">
      <section class="filters" aria-label="Filtros de documentos">
        <div class="filter-group">
          <label for="docSearchQ">Buscar texto</label>
          <input type="search" id="docSearchQ" placeholder="Título o descripción" />
        </div>
        <div class="filter-group">
          <label for="docSearchEtiqueta">Etiqueta</label>
          <input type="text" id="docSearchEtiqueta" placeholder="Etiqueta (ej. diabetes, pdf)" />
        </div>
        <div class="filter-actions">
          <button type="button" id="docSearchBtn" class="btn primary">Buscar</button>
          <button type="button" id="docClearBtn" class="btn ghost">Limpiar</button>
        </div>
      </section>

      <section id="feedback" class="feedback" hidden></section>

      <section class="pagination" aria-label="Paginación de documentos">
        <div class="pagination__controls">
          <button type="button" id="docPrevPage" class="btn ghost" disabled>Anterior</button>
          <span id="docPageInfo" class="page-info">Página 1</span>
          <button type="button" id="docNextPage" class="btn ghost">Siguiente</button>
        </div>
      </section>

      <section id="documentList" class="doc-grid"></section>
    </main>
  </div>

  <div class="doc-viewer" id="docViewer" hidden>
    <div class="doc-viewer__backdrop"></div>
    <div class="doc-viewer__dialog" role="dialog" aria-modal="true" aria-labelledby="docViewerTitle">
      <div class="doc-viewer__header">
        <h3 id="docViewerTitle">Documento</h3>
        <button type="button" class="doc-viewer__close" id="closeDocViewer" aria-label="Cerrar visor">×</button>
      </div>
      <div class="doc-viewer__body">
        <iframe id="docViewerFrame" title="Visor de documento" loading="lazy"></iframe>
        <div class="doc-viewer__loading" id="docViewerLoading">Cargando documento...</div>
      </div>
    </div>
  </div>

  <template id="docCardTemplate">
    <article class="doc-card">
      <div class="doc-meta">
        <span class="doc-tag fuente"></span>
        <span class="doc-tag tipo"></span>
      </div>
      <h3 class="doc-title"></h3>
      <p class="doc-desc"></p>
      <div class="doc-footer">
        <div class="doc-etiquetas"></div>
        <div class="doc-links">
          <a class="doc-link descarga">Abrir</a>
        </div>
      </div>
    </article>
  </template>

  <script src="../js/live-refresh.js"></script>
  <script src="../js/documentos.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
