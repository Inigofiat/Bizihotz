<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentos nutricionales</title>
  <link rel="stylesheet" href="../css/documentos.css" />
</head>
<body>
  <header class="doc-header">
    <div>
      <p class="breadcrumb"><a href="principal.html">Volver al panel</a></p>
      <h1>Documentos nutricionales</h1>
      <p class="subtitle">Acceso a enlaces configurables. Edita web/data/documentos.js para anadir mas.</p>
    </div>
  </header>

  <section id="feedback" class="feedback" hidden></section>

  <section id="documentList" class="doc-grid"></section>

  <template id="docCardTemplate">
    <article class="doc-card">
      <div class="doc-meta">
        <span class="doc-tag fuente"></span>
        <span class="doc-tag tipo"></span>
      </div>
      <h3 class="doc-title"></h3>
      <p class="doc-desc"></p>
      <div class="doc-footer">
        <div class="doc-etiquetas"></div>
        <div class="doc-links">
          <a class="doc-link descarga" target="_blank" rel="noopener">Abrir</a>
        </div>
      </div>
    </article>
  </template>

  <script src="../data/documentos.js"></script>
  <script src="../js/documentos_static.js"></script>
</body>
</html>
