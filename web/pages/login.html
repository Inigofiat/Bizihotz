<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Bizihotz</title>
  <link rel="stylesheet" href="../css/loginc.css">
</head>
<body>

  <form class="login-box" id="loginForm" novalidate>
    <img src="../images/2.png" alt="Logo Bizihotz" class="logo">

    <div class="input-group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
      </svg>
      <input
        type="text"
        id="login"
        name="login"
        placeholder="Email o nombre de usuario"
        autocomplete="username"
        required
      >
    </div>

    <div class="input-group password-group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 17c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm6-7h-1V7c0-2.8-2.2-5-5-5S7 4.2 7 7v3H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V12c0-1.1-.9-2-2-2zm-7 0H9V7c0-1.7 1.3-3 3-3s3 1.3 3 3v3h-3z"/>
      </svg>
      <input type="password" id="password" name="password" placeholder="Contrasena" autocomplete="current-password" required>
      <button type="button" id="togglePassword" class="eye-button" aria-label="Mostrar u ocultar contrasena">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e0fff0" viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.7 8 1 12c1.7 4 6 7.5 11 7.5s9.3-3.5 11-7.5c-1.7-4-6-7.5-11-7.5zm0 13c-3 0-5.5-2.5-5.5-5.5S9 6.5 12 6.5s5.5 2.5 5.5 5.5-2.5 5.5-5.5 5.5zm0-9c-2 0-3.5 1.5-3.5 3.5S10 15.5 12 15.5s3.5-1.5 3.5-3.5S14 8.5 12 8.5z"/>
        </svg>
      </button>
    </div>

    <button class="login-button" type="submit">Iniciar sesion</button>
    <p id="loginMessage" class="login-message" role="alert" aria-live="assertive"></p>
  </form>

  <script src="../js/ojoContrasenia.js"></script>
  <script>
    (function () {
      const loginForm = document.getElementById('loginForm');
      const loginInput = document.getElementById('login');
      const passwordInput = document.getElementById('password');
      const loginMessage = document.getElementById('loginMessage');
      const loadingPagePath = 'cargando.html';
      const resolveLoginEndpoints = () => {
        const localBase = 'http://localhost:4002';
        const gatewayBase = 'http://localhost:5000/gestion';
        const gatewayEndpoint = `${gatewayBase}/api/auth/login`;
        const localEndpoint = `${localBase}/api/auth/login`;

        if (window.location.protocol === 'file:') {
          return [gatewayEndpoint, localEndpoint];
        }

        const host = window.location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') {
          return [gatewayEndpoint, localEndpoint];
        }

        const baseUrl = `${window.location.protocol}//${window.location.host}`.replace(/\/$/, '');
        return [`${baseUrl}/gestion/api/auth/login`];
      };

      const LOGIN_ENDPOINTS = resolveLoginEndpoints();

      if (!loginForm || !loginInput || !passwordInput || !loginMessage) {
        return;
      }

      if (!document.referrer && history.length <= 1) {
        window.location.replace(loadingPagePath);
        return;
      }

      const resetMessage = () => {
        loginMessage.textContent = '';
        loginMessage.classList.remove('is-error');
        loginMessage.classList.remove('is-success');
      };

      const showMessage = (text, isError = true) => {
        loginMessage.textContent = text;
        loginMessage.classList.toggle('is-error', isError);
        loginMessage.classList.toggle('is-success', !isError);
      };

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const loginValueRaw = loginInput.value.trim();
        const password = passwordInput.value.trim();

        if (!loginValueRaw || !password) {
          showMessage('Indica email o nombre de usuario y contrasena.', true);
          return;
        }

        const isEmail = loginValueRaw.includes('@');
        const loginValue = isEmail ? loginValueRaw.toLowerCase() : loginValueRaw;
        const payload = isEmail
          ? { email: loginValue, password }
          : { identificador: loginValue, password };
        const payloadJson = JSON.stringify(payload);

        let lastNetworkError = null;

        let lastMessage = 'No se pudo contactar con el servidor. Intentalo mas tarde.';

        for (let index = 0; index < LOGIN_ENDPOINTS.length; index += 1) {
          const endpoint = LOGIN_ENDPOINTS[index];
          const isLast = index === LOGIN_ENDPOINTS.length - 1;

          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: payloadJson
            });

            const rawText = await response.text();
            let data = null;
            try {
              data = rawText ? JSON.parse(rawText) : null;
            } catch (parseError) {
              if (!isLast) {
                continue;
              }
            }

            if (!response.ok) {
              const mensaje = data?.mensaje || lastMessage || 'Credenciales incorrectas.';
              lastMessage = mensaje;
              if (!isLast) {
                continue;
              }
              showMessage(mensaje, true);
              return;
            }

            if (data?.usuario) {
              try {
                localStorage.setItem('bizihotzUsuario', JSON.stringify(data.usuario));
              } catch (storageError) {
                console.warn('No se pudo guardar la sesion en localStorage:', storageError);
              }
            }

            showMessage('Bienvenido, redirigiendo...', false);
            window.location.href = 'principal.html';
            return;
          } catch (error) {
            lastNetworkError = error;
            if (isLast) {
              console.error('Error iniciando sesion:', error);
              showMessage(lastMessage, true);
              return;
            }
          }
        }

        if (lastNetworkError) {
          console.error('Error iniciando sesion:', lastNetworkError);
        }
        showMessage(lastMessage, true);
      });

      loginForm.addEventListener('input', () => {
        if (loginMessage.textContent) {
          resetMessage();
        }
      });
    })();
  </script>
</body>
</html>
