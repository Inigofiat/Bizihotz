<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Bizihotz</title>
  <link rel="stylesheet" href="../css/loginc.css">
</head>
<body>

  <form class="login-box" id="loginForm" novalidate>
    <img src="../images/2.png" alt="Logo Bizihotz" class="logo">

    <div class="input-group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
      </svg>
      <input
        type="text"
        id="login"
        name="login"
        placeholder="Email o nombre de usuario"
        autocomplete="username"
        required
      >
    </div>

    <div class="input-group password-group">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 17c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1zm6-7h-1V7c0-2.8-2.2-5-5-5S7 4.2 7 7v3H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V12c0-1.1-.9-2-2-2zm-7 0H9V7c0-1.7 1.3-3 3-3s3 1.3 3 3v3h-3z"/>
      </svg>
      <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="button" id="togglePassword" class="eye-button" aria-label="Mostrar u ocultar contraseña">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e0fff0" viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.7 8 1 12c1.7 4 6 7.5 11 7.5s9.3-3.5 11-7.5c-1.7-4-6-7.5-11-7.5zm0 13c-3 0-5.5-2.5-5.5-5.5S9 6.5 12 6.5s5.5 2.5 5.5 5.5-2.5 5.5-5.5 5.5zm0-9c-2 0-3.5 1.5-3.5 3.5S10 15.5 12 15.5s3.5-1.5 3.5-3.5S14 8.5 12 8.5z"/>
        </svg>
      </button>
    </div>

    <button class="login-button" type="submit">Iniciar sesión</button>
    <p id="loginMessage" class="login-message" role="alert" aria-live="assertive"></p>
  </form>

  <script src="../js/ojoContrasenia.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
