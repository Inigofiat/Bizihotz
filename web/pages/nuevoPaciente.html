<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar nuevo paciente</title>
  <link rel="stylesheet" href="../css/nuevoPaciente.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <button type="button" class="back-btn has-logo" id="volverPrincipal" aria-label="Volver al panel principal">
        <img src="../images/2.png" alt="Logo Bizihotz" />
      </button>
      <h1>Nuevo paciente</h1>
      <div class="topbar-spacer"></div>
    </header>

    <main class="content">
      <section class="intro">
        <h2>Datos del paciente</h2>
        <p>Completa la información para incorporar a un nuevo paciente en la agenda.</p>
      </section>

      <section class="card">
        <form id="newPatientForm" novalidate>
          <div class="form-grid">
            <label class="field">
              <span>Nombre</span>
              <input type="text" id="nombrePaciente" name="nombrePaciente" maxlength="80" autocomplete="given-name" required />
            </label>

            <label class="field">
              <span>Apellidos</span>
              <input type="text" id="apellidosPaciente" name="apellidos" maxlength="120" autocomplete="family-name" required />
            </label>

            <label class="field">
              <span>Fecha de nacimiento</span>
              <input type="date" id="fechaNac" name="fechaNac" required />
            </label>

            <label class="field">
              <span>Email</span>
              <input type="email" id="emailPaciente" name="emailPaciente" autocomplete="email" inputmode="email" required />
            </label>

            <label class="field">
              <span>Teléfono</span>
              <input
                type="tel"
                id="telefonoPaciente"
                name="telefono"
                autocomplete="tel"
                inputmode="numeric"
                pattern="[0-9]{9}"
                maxlength="9"
                minlength="9"
                placeholder="123456789"
                title="El número debe tener 9 dígitos"
                required
              />
            </label>
          </div>

          <p class="helper-text">Al guardar, el paciente quedará asociado a tu agenda de forma automática.</p>

          <div id="formFeedback" class="form-feedback" role="status" aria-live="polite"></div>

          <div class="actions">
            <button type="submit" class="btn primary" id="submitPaciente">Guardar paciente</button>
            <button type="button" class="btn" id="cancelarRegistro">Cancelar</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="../js/nuevoPaciente.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
