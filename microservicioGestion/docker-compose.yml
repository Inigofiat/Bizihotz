services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  microservicio-m1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4001:4001"
    volumes:
      - ./:/app
      - microservicio_node_modules:/app/node_modules
    networks:
      - app_network

volumes:
  mongo_data:
  microservicio_node_modules:

networks:
  app_network:
    driver: bridge