services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  gestion:
    build:
      context: ./microservicioGestion
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev
    env_file:
      - ./microservicioGestion/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/gestion
    ports:
      - "4002:4001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./microservicioGestion:/app
      - gestion_node_modules:/app/node_modules

  comunicacion:
    build:
      context: ./microservicioComunicacion
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev
    env_file:
      - ./microservicioComunicacion/.env.example
    environment:
      MONGO_URI: mongodb://mongo:27017/comunicacion
      NODE_ENV: development
    ports:
      - "4103:4100"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./microservicioComunicacion:/app
      - comunicacion_node_modules:/app/node_modules

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutricion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutricion"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  nutricion:
    build:
      context: ./microservicioNutricion
      dockerfile: Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 5002 --reload
    env_file:
      - ./microservicioNutricion/.env.example
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5002/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./microservicioNutricion:/app

  documental:
    build:
      context: ./microservicioDocumental
      dockerfile: Dockerfile
    command: uvicorn app:app --host 0.0.0.0 --port 5100 --reload
    env_file:
      - ./microservicioDocumental/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/nutricion
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5100/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./microservicioDocumental:/app

  chatbot:
    build:
      context: ./microservicioChatbot
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev
    env_file:
      - ./microservicioChatbot/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/chatbot
      NODE_ENV: development
      PORT: 4701
    ports:
      - "4701:4701"
    depends_on:
      mongo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4701/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./microservicioChatbot:/app
      - chatbot_node_modules:/app/node_modules

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload
    environment:
      PORT: 5000
      GESTION_SERVICE_URL: http://gestion:4001
      GESTION_OPENAPI_URL: http://gestion:4001/docs/swagger.json
      NUTRICION_SERVICE_URL: http://nutricion:5002
      NUTRICION_OPENAPI_URL: http://nutricion:5002/openapi.json
      COMUNICACION_SERVICE_URL: http://comunicacion:4100
      COMUNICACION_OPENAPI_URL: http://comunicacion:4100/docs/swagger.json
      DOCUMENTOS_SERVICE_URL: http://documental:5100
      DOCUMENTOS_OPENAPI_URL: http://documental:5100/openapi.json
      CHATBOT_SERVICE_URL: http://chatbot:4701
      CHATBOT_OPENAPI_URL: http://chatbot:4701/docs/swagger.json
    ports:
      - "5000:5000"
    depends_on:
      gestion:
        condition: service_healthy
      nutricion:
        condition: service_healthy
      comunicacion:
        condition: service_healthy
      documental:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./api-gateway:/app

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mongo_data:
  gestion_node_modules:
  postgres_data:
  comunicacion_node_modules:
  chatbot_node_modules:
