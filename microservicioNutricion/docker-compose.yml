services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutricion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutricion"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  microservicio-nutricion:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app:app --host=0.0.0.0 --port=5002 --reload
    volumes:
      - ./:/app
    env_file:
      - .env.example
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
