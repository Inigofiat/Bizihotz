[pytest]
testpaths = tests
norecursedirs = .venv __pycache__ pytest-cache-files-* .tmp_pytest
addopts = --basetemp=./.tmp_pytest -p no:cacheprovider -p no:warnings
pythonpath = .
filterwarnings =
    ignore:.*python_multipart.*:PendingDeprecationWarning
    ignore:.*The 'app' shortcut is now deprecated.*:DeprecationWarning
    ignore:.*datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning
    ignore:.*copy` method is deprecated.*:DeprecationWarning
